# Builds and tests every push and pull request; pushes to main also publish the
# image to ghcr.io as :latest and :sha-<short commit>.
name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Image tag for this commit
        run: echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # One pass: frontend, backend, all tests, then the buildpacks image without
      # re-running the build (build-image-no-fork).
      - name: Build, test, and build the image
        run: >-
          ./mvnw -B verify spring-boot:build-image-no-fork
          "-Dspring-boot.build-image.imageName=${IMAGE}:${SHA_TAG}"

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
