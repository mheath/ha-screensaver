# Copy to config/application.yaml (git-ignored is up to you) and mount it into the
# container, or put these properties in Spring Cloud Config.
screensaver:
  home-assistant:
    url: ws://homeassistant.lan:8123/api/websocket
    token: ${HA_TOKEN}

  access:
    # Only these hosts may connect; anyone else gets a 403 and a closed connection.
    # IP addresses or CIDR ranges (no host names). Leave unset to allow everyone.
    allowed-addresses:
      - 192.168.1.1               # HAProxy

  clock:
    use-24-hour: false

  snakes:
    # At most this many guests appear alongside the pinned snakes, picked at random.
    guest-count: 2
    pinned:
      internet-download:
        entity: sensor.wan_download_mbps
        label: Internet download bandwidth
        min: 0
        max: 1000
        color: light-green
      house-power:
        entity: sensor.house_power_w
        label: House power consumption
        min: 0
        max: 12000
        color: light-red
        precision: 0
    guests:
      outdoor-wind:
        entity: sensor.wind_speed
        label: Wind speed
        min: 0
        max: 40
      people-home:
        entity: zone.home
        label: People home
        min: 0
        max: 6
        precision: 0

  calendar:
    all-day-until: "18:00"        # an all-day event alone keeps "today" on screen until this time
    calendars:
      family:
        entity: calendar.family
        label: Family
        color: blue               # blue, orange, green, pink, violet, yellow, teal, red, sky, lime,
                                  # fuchsia, amber, lavender, emerald, rose, cyan, purple, brown, slate, stone
      school:
        entity: calendar.school
        label: School             # no color: the first unused one is assigned

  rotation:
    scenes:
      clock: { weight: 2, duration: 20s }
      snakes: { weight: 2, duration: 45s }
      calendar: { weight: 2, duration: 20s }

  kiosks:
    bedroom:
      scenes:
        snakes: { enabled: false }

# Trust HAProxy's X-Forwarded-For / X-Forwarded-Proto headers (HAProxy needs
# "option forwardfor"), so the app sees the real client and scheme. Proxies on private
# addresses (10/8, 172.16/12, 192.168/16, ...) are trusted by default; for any other,
# set server.tomcat.remoteip.internal-proxies to a regex matching its address.
# screensaver.access.allowed-addresses still checks the proxy's own address.
server:
  forward-headers-strategy: native
